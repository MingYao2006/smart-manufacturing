# =====================================================================
# smart-mes 站点完整 server {} —— 可直接整段替换 1Panel「配置文件」里的内容
#
# 与仓库 mes-site.conf 的区别：
#   - mes-site.conf 是「合并片段」，只能把 location 段插进已有 server {}；
#   - 本文件是完整 server {}，root / index / listen 只出现一次。
#
# 修掉的 3 个报错：
#   "root" directive is duplicate        -> 只保留 1 条 root
#   "index" directive is duplicate       -> 只保留 1 条 index
#   duplicate location "/"               -> 只保留 1 个 location /
#   另外去掉了 include proxy_params（OpenResty 编译版默认没有该文件，
#   会报 open() failed: No such file or directory），改为 server 级统一设置请求头。
#
# 【两个视角，别混淆】root 指令里写的是【容器内】路径；
#   1Panel 文件管理器 / SSH 里操作的是【宿主机】路径，两者靠 docker volume 映射。
#   1Panel 官方 compose（appstore/apps/openresty/*/docker-compose.yml）：
#     ./www:/www                    宿主机 .../openresty/www        → 容器内 /www
#     ./root:/usr/share/nginx/html  宿主机 .../openresty/root       → 容器内 /usr/share/nginx/html
#     network_mode: host           容器与宿主机共用网络栈
#
# 因此本文件 root /www/sites/smart-mes/index 对应的宿主机目录是：
#   /opt/1panel/apps/openresty/openresty/www/sites/smart-mes/index/
#   ↑ 静态 zip 就传到这里（1Panel 文件管理器：opt → 1panel → apps →
#     openresty → openresty → www → sites → smart-mes → index），解压覆盖 index.html。
# 宿主机根目录 / 下没有 www，是正常的，别去找。
#
# 另一种更省事的放法：把文件传到宿主机
#   /opt/1panel/apps/openresty/openresty/root/   （1Panel 默认站点根目录，一定存在）
# 并把本文件第 26 行的 root 改成 /usr/share/nginx/html。
#
# ⚠️ /opt/1panel/.../root 是宿主机路径，绝对不能写进容器内的 root 指令。
#
# 官方 compose 是 network_mode: host，容器内 127.0.0.1 就是宿主机 127.0.0.1，
# 所以 proxy_pass http://127.0.0.1:9000 能直接连到 frps，无需换成 172.17.0.1。
# =====================================================================

server {
    listen 80;
    server_name 8.148.212.158;

    index index.php index.html index.htm default.php default.htm default.html;
    root  /www/sites/smart-mes/index;

    access_log /www/sites/smart-mes/log/access.log main;
    error_log  /www/sites/smart-mes/log/error.log;
    error_page 404 /404.html;

    # ---- 反代请求头：写在 server 级，所有 location 继承 ----
    # 注意：nginx 的 proxy_set_header 是数组继承，location 里只要写了任意一条
    # 就会整体覆盖掉这里的一套。所以下面的反代 location 一律不写请求头。
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host  $server_name;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $http_connection;

    # ---- 证书签发校验（1Panel 原有，保留）----
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # ---- 静态页：永远可用，电脑关机也能打开 ----
    # 若 1Panel 原本已有 location /，用这一段【替换】，不要新增第二个。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 连接守护探测端点（隧道断时快速失败，别让前端等 9 秒）----
    location = /actuator/health {
        proxy_pass http://127.0.0.1:9000;
        proxy_connect_timeout 3s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;
    }

    # ---- 业务 API：网关按 StripPrefix=1 分流，必须原样转发 URI ----
    # proxy_pass 结尾千万不要加 /，否则 /system/auth/login 会被改成 /auth/login，
    # 网关的 Path=/system/** 匹配不到，直接 404。
    location /system/ {
        proxy_pass http://127.0.0.1:9000;
    }
    location /product-service/ {
        proxy_pass http://127.0.0.1:9000;
    }
    location /production-service/ {
        proxy_pass http://127.0.0.1:9000;
    }
    location /inventory-service/ {
        proxy_pass http://127.0.0.1:9000;
    }
    location /quality-service/ {
        proxy_pass http://127.0.0.1:9000;
    }
}
