# =====================================================================
# 1Panel / OpenResty 站点「片段」：静态常驻 + API 反代到 frp 隧道
#
# ⚠️ 这是要【合并进 1Panel 已有 server {}】的片段，不是完整 server。
#    里面不要再带 root / index —— 1Panel 生成的 server {} 顶部已经有了，
#    整段粘进去会报：
#      [emerg] "root" directive is duplicate
#      [emerg] "index" directive is duplicate
#      [emerg] duplicate location "/"
#    同理，若曾用「反向代理」页面加过 mes-gateway，先删掉那条
#    （它会生成 include /www/sites/<site>/proxy/*.conf 和重复的 location /）。
#
# 合并步骤：
#   1) 保留 1Panel 原有的 listen / server_name / index / root / 日志 /
#      error_page / /.well-known/acme-challenge；
#   2) 把本文件的 location 段插到 server {} 内部；
#   3) 若原来已有 location /，用下面的 try_files 版本替换它，不要新增第二个；
#   4) 保存后 OpenResty 会自行 reload。
#
# 行为：
#   /                          -> 本地静态文件（电脑关机也能打开）
#   /system/** 等 5 类 API      -> 127.0.0.1:9000（frps 映射出来的本机网关）
#   /actuator/health           -> 同上，供前端连接守护探测
#   隧道断开时以上反代返回 502 -> 前端自动切演示模式
#
# 【请求头】1Panel 生成的 server {} 顶部已有整套 proxy_set_header
#   （Host / X-Real-IP / X-Forwarded-For / X-Forwarded-Host / Upgrade / Connection）
#   和 proxy_http_version 1.1。nginx 的 proxy_set_header 是「数组继承」：
#   location 里一条都不写 → 完整继承；一旦写了任意一条 → 整体覆盖、其余全丢。
#   所以下面的 location 刻意不写任何 proxy_set_header，也不 include proxy_params
#   （OpenResty 源码编译版默认没有 proxy_params，include 会报
#    "open() ... failed (2: No such file or directory)"）。
#   缺 X-Forwarded-Proto 的话，在 server {} 顶部补一行即可：
#     proxy_set_header X-Forwarded-Proto $scheme;
#
# 【proxy_pass 结尾不能加 /】写成 http://127.0.0.1:9000/ 会把 location
#   前缀替换掉，网关的 StripPrefix=1 就拿不到 /system/... 了。
#
# 【静态文件放哪】root 指令是容器内路径，1Panel 文件管理器里是宿主机路径。
#   官方 compose: ./www:/www、./root:/usr/share/nginx/html、network_mode: host
#   容器内 /www/sites/smart-mes/index  →  宿主机
#     /opt/1panel/apps/openresty/openresty/www/sites/smart-mes/index/
#   静态 zip 传到这个宿主机目录解压。宿主机根目录下没有 /www，别去找。
#   或更省事：传到宿主机 /opt/1panel/apps/openresty/openresty/root/，
#   并把 server {} 里唯一那条 root 改成 /usr/share/nginx/html。
#   ⚠️ /opt/1panel/.../root 是宿主机路径，不能写进容器内的 root 指令。
#
# 【127.0.0.1:9000 能通吗】官方 compose 是 network_mode: host，容器与宿主机
#   共用网络栈，容器内 127.0.0.1 就是宿主机的 127.0.0.1，直接可达 frps。
# =====================================================================

# ---- 静态页（永远可用）----
location / {
    try_files $uri $uri/ /index.html;
}

# ---- 连接守护探测端点 ----
location = /actuator/health {
    proxy_pass http://127.0.0.1:9000;
    proxy_connect_timeout 3s;
    proxy_send_timeout    5s;
    proxy_read_timeout    5s;
    # 隧道断时快速失败，别让前端守护等满 9 秒
}

# ---- 业务 API：网关按 StripPrefix=1 分流，所以原样转发 URI ----
location /system/ {
    proxy_pass http://127.0.0.1:9000;
}
location /product-service/ {
    proxy_pass http://127.0.0.1:9000;
}
location /production-service/ {
    proxy_pass http://127.0.0.1:9000;
}
location /inventory-service/ {
    proxy_pass http://127.0.0.1:9000;
}
location /quality-service/ {
    proxy_pass http://127.0.0.1:9000;
}
