<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08152e">
  <meta name="description" content="SmartMES 生产运营工作台：查看生产指标、工单、工序任务、库存与批次追溯。">
  <title>SmartMES · 生产运营工作台</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#app">跳到主要内容</a>

  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-today" viewBox="0 0 24 24">
      <path d="M4 5.5h16v14H4zM8 3v5M16 3v5M4 10h16M8 14h3M8 17h5"/>
    </symbol>
    <symbol id="i-orders" viewBox="0 0 24 24">
      <path d="M6 3.5h12v17H6zM9 8h6M9 12h6M9 16h4"/>
    </symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24">
      <path d="M3.5 7h5v5h-5zM10.5 9.5H21M3.5 15h5v5h-5zM10.5 17.5H21"/>
    </symbol>
    <symbol id="i-material" viewBox="0 0 24 24">
      <path d="m4 7 8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10M8 5l8 4"/>
    </symbol>
    <symbol id="i-trace" viewBox="0 0 24 24">
      <path d="M5 4v5c0 3 2 4 5 4h9M5 20v-5c0-3 2-4 5-4M16 10l3 3-3 3"/>
    </symbol>
    <symbol id="i-catalog" viewBox="0 0 24 24">
      <path d="M4 6.5 12 3l8 3.5-8 3.5zM4 12l8 3.5 8-3.5M4 17.5 12 21l8-3.5"/>
    </symbol>
    <symbol id="i-quality" viewBox="0 0 24 24">
      <path d="M12 3.5 20 7v5.5c0 4.7-3.2 7.1-8 8.5-4.8-1.4-8-3.8-8-8.5V7zM8.5 12l2.3 2.4 4.9-5"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 4v16M4 12h16"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24">
      <path d="M4 12h16M14 6l6 6-6 6"/>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24">
      <path d="m9 5 7 7-7 7"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="m5 5 14 14M19 5 5 19"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="M12 3 22 21H2zM12 9v5M12 17.2v.2"/>
    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </symbol>
    <symbol id="i-trend" viewBox="0 0 24 24">
      <path d="M4 19V5M4 19h16M7 15l4-4 3 2 5-6M15 7h4v4"/>
    </symbol>
    <symbol id="i-pie" viewBox="0 0 24 24">
      <path d="M12 3v9h9M12 3a9 9 0 1 0 9 9"/>
    </symbol>
    <symbol id="i-activity" viewBox="0 0 24 24">
      <path d="M3 12h4l2-6 4 12 2-6h6"/>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24">
      <path d="M18 15.5V10a6 6 0 1 0-12 0v5.5L4.2 18.2h15.6zM9.8 21h4.4"/>
    </symbol>
  </svg>

  <div class="app-shell">
    <aside class="rail" aria-label="主导航">
      <a class="brand" href="#/today" aria-label="SmartMES 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path d="M8 8h16v3.2H11.2v1.6H24V24H8v-3.2h12.8v-1.6H8z"/>
          </svg>
        </span>
        <span class="brand-type"><b>SmartMES</b></span>
      </a>

      <nav class="rail-nav" aria-label="工作台模块">
        <p class="rail-group">工作台</p>
        <a href="#/today" data-nav="today"><svg><use href="#i-today"/></svg><span>生产运营</span></a>
        <p class="rail-group">基础资料</p>
        <a href="#/basic" data-nav="basic"><svg><use href="#i-catalog"/></svg><span>产品与工艺</span></a>
        <p class="rail-group">生产管理</p>
        <a href="#/orders" data-nav="orders"><svg><use href="#i-orders"/></svg><span>生产工单</span></a>
        <a href="#/tasks" data-nav="tasks"><svg><use href="#i-tasks"/></svg><span>工序任务</span></a>
        <p class="rail-group">物料管理</p>
        <a href="#/materials" data-nav="materials"><svg><use href="#i-material"/></svg><span>库存与物料</span></a>
        <p class="rail-group">质量管理</p>
        <a href="#/quality" data-nav="quality"><svg><use href="#i-quality"/></svg><span>质检任务</span></a>
        <a href="#/trace" data-nav="trace"><svg><use href="#i-trace"/></svg><span>批次追溯</span></a>
      </nav>

      <div class="rail-foot">
        <button class="rail-help" type="button" data-action="open-connection" aria-label="接口连接设置">
          <span class="connection-dot" id="rail-connection-dot"></span>
          <span>接口连接</span>
        </button>
        <button class="rail-collapse" type="button" data-action="toggle-rail" aria-label="收起导航栏" aria-expanded="true">
          <svg><use href="#i-chevron"/></svg><span>收起侧栏</span>
        </button>
        <span class="rail-version">v1.0</span>
      </div>
    </aside>

    <main class="workbench">
      <header class="topbar">
        <div class="crumbs">
          <button class="crumbs-toggle" type="button" data-action="toggle-rail" aria-label="展开或收起导航栏">
            <svg><use href="#i-menu"/></svg>
          </button>
          <nav class="crumb-trail" id="crumbs" aria-label="面包屑"></nav>
        </div>

        <div class="topbar-meta">
          <button class="connection-pill" id="connection-button" type="button" data-action="open-connection">
            <span class="connection-dot"></span>
            <span id="connection-label">演示数据</span>
          </button>
          <div class="shift-clock" aria-label="当前班次与时间">
            <time id="live-clock">--:--:--</time>
            <span id="shift-label">早班 08:00–16:00</span>
          </div>
          <div class="notice" id="notice-root">
            <button class="notice-button" id="notice-button" type="button" data-action="toggle-notice"
                    aria-expanded="false" aria-controls="notice-panel" aria-label="待办提醒">
              <svg aria-hidden="true"><use href="#i-bell"/></svg>
              <span class="notice-badge" id="notice-badge" hidden>0</span>
            </button>
            <div class="notice-panel" id="notice-panel" role="dialog" aria-label="待办提醒" hidden>
              <header class="notice-head">
                <h2>待办提醒</h2>
                <span class="notice-count" id="notice-count"></span>
              </header>
              <div class="notice-list" id="notice-list"></div>
              <footer class="notice-foot">网关暂无消息接口，提醒由工单、任务与库存状态实时推导。</footer>
            </div>
          </div>
          <button class="account" id="account-button" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="account-avatar" aria-hidden="true">张</span>
            <span class="account-copy"><b id="account-name">张计划</b><small id="account-role">生产计划员</small></span>
            <svg><use href="#i-chevron"/></svg>
          </button>
        </div>
      </header>

      <div class="demo-notice" id="demo-notice" role="status" hidden>
        <svg aria-hidden="true"><use href="#i-alert"/></svg>
        <p><b>当前操作仅限演示，不会真实落库。</b>建单、工序流转、质检、报工都只改浏览器里的数据，刷新页面就恢复原样。要操作真实工单请先连接网关。</p>
        <button class="button demo-notice-button" type="button" data-action="open-connection">连接网关</button>
      </div>

      <div id="app" class="view" tabindex="-1"></div>
    </main>

    <nav class="mobile-nav" aria-label="移动端导航">
      <a href="#/today" data-nav="today"><svg><use href="#i-today"/></svg><span>工作台</span></a>
      <a href="#/orders" data-nav="orders"><svg><use href="#i-orders"/></svg><span>工单</span></a>
      <a href="#/tasks" data-nav="tasks"><svg><use href="#i-tasks"/></svg><span>工序</span></a>
      <a href="#/materials" data-nav="materials"><svg><use href="#i-material"/></svg><span>物料</span></a>
      <button class="mobile-more-trigger" id="mobile-more-button" type="button" data-action="toggle-mobile-more" aria-expanded="false" aria-controls="mobile-more-menu">
        <svg aria-hidden="true"><use href="#i-menu"/></svg>
        <span>更多</span>
      </button>
    </nav>

    <nav class="mobile-more-menu" id="mobile-more-menu" aria-label="更多模块" hidden>
      <a href="#/basic" data-nav="basic">
        <svg aria-hidden="true"><use href="#i-catalog"/></svg>
        <span><b>产品与工艺</b><small>产品 / BOM / 工艺路线 / 物料</small></span>
      </a>
      <a href="#/trace" data-nav="trace">
        <svg aria-hidden="true"><use href="#i-trace"/></svg>
        <span><b>批次追溯</b><small>从成品回看原料与工序</small></span>
      </a>
      <a href="#/quality" data-nav="quality">
        <svg aria-hidden="true"><use href="#i-quality"/></svg>
        <span><b>质检任务</b><small>判定放行或退回返工</small></span>
      </a>
    </nav>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <div>
        <p class="drawer-kicker" id="drawer-kicker"></p>
        <h2 id="drawer-title"></h2>
      </div>
      <button class="icon-button" type="button" data-action="close-drawer" aria-label="关闭详情">
        <svg><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="modal-root" id="modal-root" hidden>
    <div class="modal-backdrop" data-action="close-modal"></div>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head">
        <div>
          <p class="modal-kicker" id="modal-kicker"></p>
          <h2 id="modal-title"></h2>
        </div>
        <button class="icon-button" type="button" data-action="close-modal" aria-label="关闭对话框">
          <svg><use href="#i-close"/></svg>
        </button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </section>
  </div>

  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div class="noscript">此工作台需要启用 JavaScript 才能读取工单与工序数据。</div>
  </noscript>

  <script src="./data.js"></script>
  <script src="./api.js"></script>
  <script src="./app.js"></script>
</body>
</html>
